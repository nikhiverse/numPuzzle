<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>numPuzzle</title>
    <link rel="icon" type="image/png" href="pics/logo.png" />
    <link href="numPuzz.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div id="game-wrapper">
      <div id="header-container">
        <img src="pics/logo.png" alt="NumPuzzle Logo" id="header-logo" />
        <h1 id="title">numPuzzle</h1>
      </div>

      <div id="setup-screen">
        <div class="setup-section">
          <h3>Puzzle Size</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="gridSize">
              <input type="radio" name="gridSize" id="mini" value="4" checked />
              <label for="mini">4x4 (Mini - 15 Tiles)</label>
            </div>
            <div class="radio-option" data-option="gridSize">
              <input type="radio" name="gridSize" id="penta" value="5" />
              <label for="penta">5x5 (Penta - 24 Tiles)</label>
            </div>
            <div class="radio-option" data-option="gridSize">
              <input type="radio" name="gridSize" id="hexa" value="6" />
              <label for="hexa">6x6 (Hexa - 35 Tiles)</label>
            </div>
          </div>
        </div>

        <div class="setup-section">
          <h3>Select Range</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="rangeMode">
              <input
                type="radio"
                name="rangeMode"
                id="normal"
                value="normal"
                checked
              />
              <label for="normal">Normal</label>
            </div>
            <div class="radio-option" data-option="rangeMode">
              <input type="radio" name="rangeMode" id="expand" value="expand" />
              <label for="expand">Expand</label>
            </div>
          </div>
        </div>

        <div class="setup-section">
          <h3>Timer Mode</h3>
          <div class="difficulty-options">
            <div class="radio-option selected" data-option="timerMode">
              <input
                type="radio"
                name="timerMode"
                id="normalTime"
                value="countup"
                checked
              />
              <label for="normalTime">⏱️ CountUp Timer</label>
            </div>
            <div class="radio-option" data-option="timerMode">
              <input
                type="radio"
                name="timerMode"
                id="countdown"
                value="countdown"
              />
              <label for="countdown">⏳ Countdown Timer</label>
            </div>
          </div>
        </div>

        <div
          class="setup-section"
          id="time-limit-section"
          style="display: none"
        >
          <h3>Time Limit (Minutes)</h3>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 15px;
              margin-top: 10px;
            "
          >
            <input
              type="number"
              id="time-limit"
              min="1"
              max="10"
              value="5"
              style="
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #0096ff;
                background: #000;
                color: white;
                width: 80px;
                text-align: center;
                font-size: 1.1rem;
              "
            />
            <span style="color: #888">Range: 1-10 min</span>
          </div>
        </div>

        <button class="start-btn" onclick="game.startGame()">
          Start Puzzle
        </button>
      </div>

      <div id="game-screen">
        <div id="game-header">
          <div class="game-info">Size: <span id="size-display">5x5</span></div>
          <div class="game-info">
            Range: <span id="range-display">Normal</span>
          </div>
          <div class="game-info">
            Expected Moves: <span id="expected-moves-display">0</span>
          </div>
        </div>

        <div id="game-container">
          <div id="timer-container">
            <div id="medal-container">
              <div id="moves">Moves: 00</div>
            </div>
            <div id="clock-container">
              <div class="icon">⏳</div>
              <div id="watch">05:00</div>
            </div>
          </div>
          <div id="square-container"></div>
          <div id="control-buttons">
            <button
              class="control-btn"
              id="new-game-btn"
              onclick="game.backToSetup()"
            >
              Main Menu
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="astar_solver.js"></script>
    <script src="numPuzz.js"></script>
  </body>
</html>
